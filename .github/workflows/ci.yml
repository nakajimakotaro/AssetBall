name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AssetBall.sln
      - run: dotnet build AssetBall.sln -c Release --no-restore
      - run: dotnet test AssetBall.sln -c Release --no-build --logger trx
